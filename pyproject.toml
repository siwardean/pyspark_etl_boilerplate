[project]
name = "pyspark-etl-boilerplate"
# The single source of truth for the version. Every merge to main is released
# as v<version>, so each pull request must bump it.
version = "0.1.0"
description = "Batch and streaming jobs on Spark or Flink, with validated config, logging and MLflow tracking built in."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyspark>=3.5",
    "mlflow>=2.9",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Only needed for jobs that use FlinkSessionMixin (a large install).
flink = ["apache-flink>=1.18"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=4.0",
    "ruff>=0.8",
]
# To regenerate training/slides.pptx.
slides = ["python-pptx>=1.0"]

[tool.uv]
# An application run from the repository, not a library to build and publish.
package = false

[tool.ruff]
line-length = 110
target-version = "py310"
# The Databricks notebooks are not checked: they rely on runtime globals
# (spark, dbutils, display) and are laid out by hand for trainees.
extend-exclude = ["training/[0-9][0-9]_*.py"]
force-exclude = true

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: likely bugs, UP: outdated syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["jobs", "utils", "etl"]

[tool.ruff.lint.per-file-ignores]
"training/generate_slides.py" = ["E501", "F401", "F811", "F841", "B007", "B905"]
# Engine imports come after pytest.importorskip() on purpose.
"tests/*.py" = ["E402"]

[tool.ruff.format]
# README snippets and the slide generator are laid out by hand; leave them as written.
exclude = ["*.md", "training/generate_slides.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::ResourceWarning"]
