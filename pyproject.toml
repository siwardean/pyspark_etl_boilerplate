[tool.ruff]
line-length = 110
target-version = "py310"
# The Databricks notebooks are not checked: they rely on runtime globals
# (spark, dbutils, display) and are laid out by hand for trainees.
extend-exclude = ["training/[0-9][0-9]_*.py"]
force-exclude = true

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: likely bugs, UP: outdated syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["jobs", "utils", "etl"]

[tool.ruff.lint.per-file-ignores]
"training/generate_slides.py" = ["E501", "F401", "F811", "F841", "B007", "B905"]
# Engine imports come after pytest.importorskip() on purpose.
"tests/*.py" = ["E402"]

[tool.ruff.format]
# README snippets and the slide generator are laid out by hand; leave them as written.
exclude = ["*.md", "training/generate_slides.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::ResourceWarning"]
