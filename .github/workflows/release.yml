name: Release

# Every merge to main is a release: the version in pyproject.toml is tagged
# and published as a GitHub release with generated notes.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error file=pyproject.toml::${TAG} already exists. Bump 'version' in pyproject.toml."
            exit 1
          fi
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
