name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (ruff and file checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Unit tests (pytest)
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4      # Spark and Flink run on the JVM
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra flink
      - run: uv run --no-sync pytest tests/ -v

  version:
    name: Version is new (each merge to main is a release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if pyproject.toml's version was already released
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error file=pyproject.toml::Version ${version} is already released. Bump 'version' in pyproject.toml."
            exit 1
          fi
          echo "Merging this pull request will release v${version}."

  docs:
    name: Documentation updated with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the check compares the branch with its base
      - run: python3 scripts/check_docs_updated.py "origin/${{ github.base_ref }}"
