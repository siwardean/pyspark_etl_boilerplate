# Streaming example, runnable locally from the repo root on either engine:
#   python main.py --job jobs.examples.booking_stream_job.BookingSparkStreamJob --conf config/dev/example_stream.yaml
#   python main.py --job jobs.examples.booking_stream_job.BookingFlinkStreamJob --conf config/dev/example_stream.yaml
# (the Flink one needs: uv sync --extra flink)

job:
  env: dev
  source_path: "{bucket}/booking_events"      # landing directory: every file in it is read
  target_path: "{output}/booking_stream"
  # stream_timeout_seconds: 60     # stop a never-ending stream after this long

storage:
  bucket: data
  output: output

# Used by BookingSparkStreamJob: passed as-is to the SparkSession builder.
spark:
  spark.app.name: BookingStreamJob
  spark.master: "local[*]"
  spark.sql.shuffle.partitions: 4

# Used by BookingFlinkStreamJob: passed as-is to the Flink TableEnvironment.
flink:
  pipeline.name: BookingStreamJob
  parallelism.default: 1

mlflow:
  enabled: true
  experiment: BookingStreamJob-dev

logging:
  level: INFO
