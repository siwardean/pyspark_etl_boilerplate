# Install once with:  uv run pre-commit install
# Run on everything:  uv run pre-commit run --all-files
# Skipped: sample data, the slide deck and the Databricks notebooks.
exclude: ^data/|\.pptx$|^training/\d\d_.*\.py$|^training/scala/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check      # lint, with safe auto-fixes
        args: [--fix]
      - id: ruff-format     # formatting

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock         # uv.lock must match pyproject.toml
